<html><head><link rel="stylesheet" href="brand.css"><style>
body{width:1200px;height:1000px;background:var(--papel);display:flex;gap:64px;justify-content:center;align-items:flex-start;padding-top:56px}
.col{display:flex;flex-direction:column;gap:18px;align-items:center}
.cap{font:600 14px Archivo;color:var(--texto-2);text-transform:uppercase;letter-spacing:.08em;font-stretch:85%}
.phone{width:390px;height:844px;border-radius:44px;background:#fff;border:10px solid var(--asfalto);overflow:hidden;position:relative;box-shadow:0 24px 60px rgba(20,20,19,.18)}
.top{display:flex;align-items:center;gap:10px;padding:46px 20px 14px}
.top .nm{font-weight:700;font-size:16px;font-stretch:92%}
.mono-logo{width:34px;height:34px;border-radius:9px;background:var(--acc);color:#fff;display:grid;place-items:center;font:800 14px Archivo;font-stretch:80%}
.map{height:300px;background:#eeede8;position:relative}
.st{padding:18px 20px 0}
.eyebrow{font:700 12px Archivo;font-stretch:80%;letter-spacing:.1em;text-transform:uppercase;color:var(--texto-3)}
.big{font-size:30px;margin-top:4px}
.eta{font-size:15px;color:var(--texto-2);margin-top:6px}
.eta b{color:var(--asfalto)}
.tl{margin:18px 20px 0;display:flex;flex-direction:column;gap:0}
.tl div{display:grid;grid-template-columns:22px 1fr auto;align-items:center;font-size:14px;height:34px;position:relative}
.tl i{width:12px;height:12px;border-radius:50%;border:3px solid var(--acc);background:#fff;z-index:1}
.tl .ok i{background:var(--acc)}
.tl .fut{color:var(--texto-3)} .tl .fut i{border-color:#cfccc4}
.tl div:not(:last-child)::after{content:"";position:absolute;left:5px;top:22px;height:24px;width:2px;background:#e4e2dc}
.tl .ok:not(:last-child)::after{background:var(--acc)}
.tl time{font:500 13px "IBM Plex Mono";color:var(--texto-3)}
.foot{position:absolute;bottom:0;left:0;right:0;padding:14px 20px 26px;border-top:1px solid var(--linha);display:flex;justify-content:space-between;align-items:center}
.btn{margin:26px 20px 0;height:48px;border-radius:12px;border:1.5px solid var(--asfalto);display:grid;place-items:center;font-weight:600;font-size:15px}
.selo{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--texto-3)}
.selo img{height:14px}
</style></head><body>
<script>
function phone(acc,brandHtml,name,selo){return `<div class="phone" style="--acc:${acc}">
<div class="top">${brandHtml}<span class="nm">${name}</span></div>
<div class="map"><svg width="370" height="300" viewBox="0 0 370 300">
<g stroke="#fff" stroke-width="14"><path d="M0 70 H370 M0 190 H370 M0 262 H370 M70 0 V300 M190 0 V300 M300 0 V300"/></g>
<g stroke="#fff" stroke-width="6"><path d="M0 130 H370 M130 0 V300 M250 0 V300"/></g>
<path d="M70 262 V190 H190 V130 L250 70 H300" fill="none" stroke="${acc}" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" opacity=".35"/>
<path d="M70 262 V190 H190 V160" fill="none" stroke="${acc}" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="70" cy="262" r="9" fill="#fff" stroke="${acc}" stroke-width="5"/>
<circle cx="190" cy="160" r="15" fill="${acc}" opacity=".18"/><circle cx="190" cy="160" r="8" fill="${acc}" stroke="#fff" stroke-width="3"/>
<circle cx="300" cy="70" r="11" fill="#141413"/></svg></div>
<div class="st"><div class="eyebrow">Pedido <span class="mono">#4821</span></div><div class="big disp">Saiu para entrega</div>
<div class="eta">Chega em <b>~12 min</b> · São Mateus</div></div>
<div class="tl"><div class="ok"><i></i><span>Pedido aceito</span><time>14:02</time></div>
<div class="ok"><i></i><span>Coletado na loja</span><time>14:10</time></div>
<div class="ok"><i></i><span>Saiu para entrega</span><time>14:12</time></div>
<div class="fut"><i></i><span>Entregue, com foto</span><time>--:--</time></div></div>
<div class="btn">Falar com a central</div><div class="foot">${selo}</div></div>`}
const epm='<img src="../logo/epm-simbolo.svg" style="height:34px">';
document.write(`<div class="col"><div class="cap">Planos Essencial e Central</div>${phone('#E2570F',epm,'Entrega Pra Mim','<span class="selo">Entrega feita por <b style="color:#141413">&nbsp;Rápido JF Motofrete</b></span>')}</div>`);
document.write(`<div class="col"><div class="cap">Plano Marca Própria</div>${phone('#0F6B5C','<span class="mono-logo">RJ</span>','Rápido JF Motofrete','<span class="selo">tecnologia <b style="color:#52514e">&nbsp;Entrega Pra Mim</b></span>')}</div>`);
</script></body></html>

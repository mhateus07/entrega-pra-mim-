# Produção na VPS (Contabo + EasyPanel/Traefik), mesmo padrão dos outros apps em /opt.
# Uso: cp .env.production.example .env  (preencher)  &&  docker compose up -d --build
# Outra instância (ex.: demo): clone em outra pasta e defina APP_SLUG e APP_DOMAIN no .env.
services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: entrega_pra_mim
      MYSQL_USER: entrega
      MYSQL_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?defina DB_ROOT_PASSWORD no .env}
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: mysql://entrega:${DB_PASSWORD}@db:3306/entrega_pra_mim
      REDIS_URL: redis://redis:6379
      COMPROVANTE_DIR: /app/storage/comprovantes
      LOGO_DIR: /app/storage/logos
    volumes:
      - comprovantes:/app/storage/comprovantes
      - logos:/app/storage/logos
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    # Liveness, igual ao Dockerfile: só confirma que o processo responde. Banco e
    # Redis ficam em /api/health/ready, para o contêiner não sair do Traefik por
    # causa de uma queda do Redis (o rate limit cai para a memória nesse caso).
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - default
      - easypanel
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=easypanel"
      - "traefik.http.routers.${APP_SLUG:-entregapramim}.entrypoints=https"
      - "traefik.http.routers.${APP_SLUG:-entregapramim}.rule=Host(`${APP_DOMAIN:-entregapramim.impulsiodigital.com}`)"
      - "traefik.http.routers.${APP_SLUG:-entregapramim}.tls.certresolver=letsencrypt"
      - "traefik.http.services.${APP_SLUG:-entregapramim}.loadbalancer.server.port=3000"

  # Despacho com oferta: expira ofertas vencidas e oferece ao próximo motoboy.
  # Chama a rota interna a cada 15 s; sem CRON_SECRET no .env, não sobe.
  # Falhas aparecem em `docker compose logs despacho-cron` com o código HTTP.
  despacho-cron:
    image: curlimages/curl:8.10.1
    restart: always
    environment:
      CRON_SECRET: ${CRON_SECRET:?defina CRON_SECRET no .env (openssl rand -hex 32)}
      TZ: America/Sao_Paulo
    entrypoint: ["sh", "-c", "while true; do c=$$(curl -s -m 10 -o /dev/null -w '%{http_code}' -X POST -H \"Authorization: Bearer $$CRON_SECRET\" http://app:3000/api/jobs/despacho); [ \"$$c\" = 200 ] || echo \"[despacho $$(date '+%F %T')] falhou: HTTP $$c\"; sleep 15; done"]
    depends_on:
      - app

  # Backup diário do banco e dos arquivos (scripts/backup.sh), em ./backups no servidor.
  # Na hora: docker compose run --rm backup agora
  backup:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_PWD: ${DB_ROOT_PASSWORD:?defina DB_ROOT_PASSWORD no .env}
      TZ: America/Sao_Paulo
      BACKUP_HORA: ${BACKUP_HORA:-03:00}
      BACKUP_RETENCAO_DIAS: ${BACKUP_RETENCAO_DIAS:-14}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
      - comprovantes:/dados/comprovantes:ro
      - logos:/dados/logos:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

networks:
  default:
    name: ${APP_SLUG:-entrega}_default
  easypanel:
    external: true

volumes:
  mysql:
  comprovantes:
  logos:
